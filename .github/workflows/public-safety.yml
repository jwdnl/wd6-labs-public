name: Public repository safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject private address space
        shell: bash
        run: |
          if rg --hidden --glob '!.git/**' --glob '!.github/workflows/public-safety.yml' \
            '(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})'; then
            echo 'Private address space is not allowed in this repository.' >&2
            exit 1
          fi

      - name: Reject common credential material
        shell: bash
        run: |
          if rg --hidden --glob '!.git/**' --glob '!.github/workflows/public-safety.yml' \
            '(-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|age1[0-9a-z]{40,}|AKIA[0-9A-Z]{16})'; then
            echo 'Possible credential or private key material detected.' >&2
            exit 1
          fi
